services:
  # ── 1. API Backend Web Service ──
  - type: web
    name: filmyfrolic-api
    env: node
    rootDir: .
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --frozen-lockfile && pnpm --filter @filmyfrolic/api build
    startCommand: node apps/api/src/index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  # ── 2. Web Frontend Static Site ──
  - type: web
    name: filmy-frolic-new-frontend
    env: static
    rootDir: .
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --frozen-lockfile && pnpm --filter @filmyfrolic/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── 3. Admin Dashboard Static Site ──
  - type: web
    name: filmyfrolic-admin
    env: static
    rootDir: .
    buildCommand: npm install -g pnpm@9.15.0 && pnpm install --frozen-lockfile && pnpm --filter @filmyfrolic/admin build
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
